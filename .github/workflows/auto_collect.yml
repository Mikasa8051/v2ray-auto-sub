# .github/workflows/auto_collect.yml
name: Auto Collect Nodes

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动触发
  workflow_dispatch:     # 支持手动触发

# 显式赋予工作流写入权限，解决 Git Push 403 报错
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Collector
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sub.txt nodes.txt
          git diff --staged --quiet || git commit -m "Auto update node subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
