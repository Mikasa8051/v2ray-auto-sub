name: Auto Scrape & Speed Test

on:
  schedule:
    - cron: '0 */4 * * *'  # 每 4 小时自动触发运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install sing-box Core
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -zxvf sing-box.tar.gz
          sudo mv "sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box

      - name: Run Pipeline
        run: |
          python main.py

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true  # 保持提交历史干净，防止仓库无限膨胀
